; Cat Carry settings. The holding pose can be tuned live in SKSE Menu Framework (Cat Carry > Settings).

[General]
bEnabled = 1
; how close (game units, along the ground) you have to be to pick a cat up
fMaxDistance = 110
; english, french, german, italian, spanish, polish, russian, japanese, chinese (empty = the game's language)
sLanguage = 
; the word shown before the cat's name when you look at it (empty = "Pick up (hold)" in your language)
sPickUpText = 
; seconds you hold Activate to pick the cat up (a short tap stays the game's normal activation)
fHoldTime = 0.45
; more races that can be picked up (plugin|form ID, separated by commas) besides the animals in
; SKSE\Plugins\CatCarry\Animals\*.ini (installed by the FOMOD: House Cats, Piglet)
sRaces = 

[Pickup]
; kneel down for cats on the floor (else you only bend forward)
bKneel = 1
; kneel when the cat's body is at most this high above your feet
fKneelBelow = 60
; degrees you may bend forward to reach the cat
fMaxLean = 40
bLookAtCat = 1

[Hold]
; 0 = the side its head points to when you pick it up, 1 = always on your left, 2 = always on your right
iSide = 0
; the cat gets a bit smaller in your arms (looks right against your body; big cats of other mods fit too):
; its size times fHeldSize, and at most fMaxBodyLength long from chest to hips (game units, 0 = no limit;
; a House Cat is about 22)
fHeldSize = 0.8
fMaxBodyLength = 18
; the cat's body center from your chest, for the left side (mirrored on the right): right, forward, up
fCatRight = -5
fCatForward = 17
fCatUp = 6
; degrees: head tipped out to the side, head tipped back towards you, belly turned outwards
fCatLean = 20
fCatBack = 10
fCatTurn = 18
; the cat's upper front legs: 0 = hang straight down, higher = forward over your arm (the paws hang)
fPawsForward = 1.18
; 0 = its legs keep the pose they had on the floor .. 1 = they hang fully
fLegHang = 0.5
bCatLooksAround = 1
bTailSway = 1
; degrees your head turns and tilts away from the cat's head while you hold it
fHeadAway = 15
; your hand on its chest strokes the cat now and then, every fPetEvery seconds
bPetCat = 1
fPetEvery = 7
