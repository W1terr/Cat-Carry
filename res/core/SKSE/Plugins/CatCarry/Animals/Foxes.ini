; Cat Carry: animals you can pick up. Every race with one of the skeletons in sSkeletons counts (parts of the skeleton
; path, separated by commas), and the races in sRaces (plugin|form ID): so modded pets on these skeletons or races
; work without a patch. Animals hostile to you are never picked up.
; How it's held comes from the skeleton: chicken or hare = in one arm against your chest; skeever (cats too) and
; canine (foxes, dogs) = upright in both arms.
; Optional: sStyle = cat / onearm / piglet, fSize (size in your arms), fGirth (how round it is: hands further out),
; fBelly, fMaxScale (only animals at most this big), the head settings fHeadTurn, fHeadPitch, fHeadYaw, fHeadRoll,
; fNeckLift.
; foxes, and the pets on the fox skeleton. Foxes use the wolf skeleton, so wolves are kept out by their size: only
; animals at most fMaxScale big (a fox 0.6, a wolf 1 and more)
[Animal]
sName = Foxes
sRaces = Skyrim.esm|0x109C7C
sSkeletons = Actors\Canine\Character Assets Wolf, Fox
fMaxScale = 0.85
