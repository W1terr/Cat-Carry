; Cat Carry: animals you can pick up. Every race with one of the skeletons in sSkeletons counts (parts of the skeleton
; path, separated by commas), and the races in sRaces (plugin|form ID): so modded pets on these skeletons or races
; work without a patch. Animals hostile to you are never picked up.
; How it's held comes from the skeleton: chicken or hare = in one arm against your chest; skeever (cats too),
; sabre cat (small cats) and canine (foxes, dogs) = upright in both arms.
; Optional: sStyle = cat / onearm / piglet, fSize (size in your arms), fGirth (how round it is: hands further out),
; fBelly, fMaxScale (only animals at most this big), the head settings fHeadTurn, fHeadPitch, fHeadYaw, fHeadRoll,
; fNeckLift.
; Piglet - The courageous piggy companion (cow skeleton)
[Animal]
sName = Piglet
; races (plugin|form ID, separated by commas)
sRaces = piggypet.esp|0x803
; its size in your arms, times the size settings of CatCarry.ini
fSize = 1
; how round its body is: your hands this much further from its spine
fGirth = 1.25
; how far the middle of its body is below its spine bones (game units for a House Cat sized animal);
; the cow skeleton's spine runs along the top of its back
fBelly = 6
; piglet = his own little show in your arms: curly tail wiggles, ear twitches, a sniff around, and after you pet him
; he nuzzles your face and kicks his legs for joy (empty = like the cats)
sStyle = piglet
; how far his head turns to look around: 0 = snout in line with his body .. 1 = as far as the cats
fHeadTurn = 1
; his head: degrees up (+) / down, to the side, tilted; how much the neck lifts it (0 .. 2)
fHeadPitch = -60
fHeadYaw = 0
fHeadRoll = -13
fNeckLift = 1
